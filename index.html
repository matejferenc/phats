<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiso Photo — Portrait · Events · Products · Prague</title>
    <meta name="description" content="Profesionální fotografie v Praze — portréty, události a produktová fotografie. Professional photography in Prague." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tiso Photo" />
    <meta property="og:title" content="Tiso Photo — Portrait · Events · Products" />
    <meta property="og:description" content="Profesionální fotografie v Praze." />
    <meta property="og:image" content="/phats/photos_webp_small/portrait/photo_01.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tiso Photo" />
    <meta name="twitter:image" content="/phats/photos_webp_small/portrait/photo_01.webp" />
    <link rel="preload" as="image" href="/phats/photos_webp/portrait/photo_01.webp" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>

    <header id="site-header">
      <nav class="nav">
        <a href="#" class="logo" aria-label="Tiso Photo">Tiso<span>Photo</span></a>
        <div class="nav-links">
          <a href="#portrait" data-i18n="nav_portrait"></a>
          <a href="#events"   data-i18n="nav_events"></a>
          <a href="#products" data-i18n="nav_products"></a>
          <a href="#contact"  data-i18n="nav_contact"></a>
          <button id="lang-toggle" class="lang-toggle" aria-label="Switch language">EN</button>
        </div>
      </nav>
    </header>

    <section id="hero" aria-label="Hero">
      <div class="hero-bg" id="hero-bg"></div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <p class="hero-eyebrow" data-i18n="hero_eyebrow"></p>
        <h1 data-i18n="hero_title"></h1>
        <p class="hero-sub" data-i18n="hero_subtitle"></p>
        <div class="hero-cats">
          <a href="#portrait" class="hero-cat" data-i18n="nav_portrait"></a>
          <a href="#events"   class="hero-cat" data-i18n="nav_events"></a>
          <a href="#products" class="hero-cat" data-i18n="nav_products"></a>
        </div>
        <a href="#portrait" class="btn-primary" data-i18n="hero_cta"></a>
      </div>
      <a href="#portrait" class="hero-scroll" aria-label="Scroll down">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </a>
    </section>

    <section id="portrait" aria-labelledby="portrait-heading">
      <div class="container">
        <header class="section-header">
          <h2 id="portrait-heading" data-i18n="portrait_title"></h2>
          <p data-i18n="portrait_subtitle"></p>
        </header>
        <ul class="gallery-grid" id="gallery-portrait" role="list"></ul>
      </div>
    </section>

    <section id="events" aria-labelledby="events-heading">
      <div class="container">
        <header class="section-header">
          <h2 id="events-heading" data-i18n="events_title"></h2>
          <p data-i18n="events_subtitle"></p>
        </header>
        <ul class="gallery-grid" id="gallery-events" role="list"></ul>
      </div>
    </section>

    <section id="products" aria-labelledby="products-heading">
      <div class="container">
        <header class="section-header">
          <h2 id="products-heading" data-i18n="products_title"></h2>
          <p data-i18n="products_subtitle"></p>
        </header>
        <ul class="gallery-grid" id="gallery-products" role="list"></ul>
      </div>
    </section>

    <section id="contact" aria-labelledby="contact-heading">
      <div class="container container--narrow">
        <header class="section-header">
          <h2 id="contact-heading" data-i18n="contact_title"></h2>
          <p data-i18n="contact_subtitle"></p>
        </header>
        <div class="contact-info">
          <div class="contact-item">
            <span class="contact-label" data-i18n="contact_email_label"></span>
            <a href="mailto:martintisophotographer@gmail.com">martintisophotographer@gmail.com</a>
          </div>
          <div class="contact-item">
            <span class="contact-label" data-i18n="contact_phone_label"></span>
            <a href="tel:+420776565300">+420 776 565 300</a>
          </div>
        </div>
      </div>
    </section>

    <footer id="site-footer">
      <div class="container footer-inner">
        <a href="#" class="logo logo--footer" aria-label="Tiso Photo">Tiso<span>Photo</span></a>
        <nav class="social-links" aria-label="Social media">
          <a href="https://www.instagram.com/martintiso" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
            </svg>
          </a>
          <a href="https://www.facebook.com/martin.tiso" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
            </svg>
          </a>
          <a href="https://cz.linkedin.com/in/martintiso" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>
            </svg>
          </a>
        </nav>
        <p class="footer-copy" data-i18n="footer_copy"></p>
      </div>
    </footer>

    <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
      <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
      <button class="lightbox-close" id="lightbox-close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <figure class="lightbox-figure">
        <img id="lightbox-img" src="" alt="" />
      </figure>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
