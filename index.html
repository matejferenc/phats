<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiso Photo — Portrait · Events · Products · Prague</title>
    <meta name="description" content="Profesionální fotografie v Praze — portréty, události a produktová fotografie." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tiso Photo" />
    <meta property="og:image" content="/photos/photos_webp_small/portrait/photo_01.webp" />
    <link rel="preload" as="image" href="/photos/photos_webp/portrait/photo_01.webp" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>

    <header id="site-header">
      <nav class="nav">
        <a href="/photos/" class="logo" aria-label="Tiso Photo">Tiso<span>Photo</span></a>
        <div class="nav-links">
          <a href="/photos/portrait/" data-i18n="nav_portrait"></a>
          <a href="/photos/events/"   data-i18n="nav_events"></a>
          <a href="/photos/products/" data-i18n="nav_products"></a>
          <a href="#contact"         data-i18n="nav_contact"></a>
          <button id="lang-toggle" class="lang-toggle" aria-label="Switch language">EN</button>
        </div>
      </nav>
    </header>

    <section id="hero" aria-label="Hero">
      <div class="hero-bg" id="hero-bg"></div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <p class="hero-eyebrow" data-i18n="hero_eyebrow"></p>
        <h1 data-i18n="hero_title"></h1>
        <p class="hero-sub" data-i18n="hero_subtitle"></p>
      </div>
      <a href="#categories" class="hero-scroll" aria-label="Scroll down">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </a>
    </section>

    <section id="categories" aria-label="Categories">
      <div class="container">
        <div class="cat-grid">

          <a href="/photos/portrait/" class="cat-card" aria-label="Portrait gallery">
            <div class="cat-img" id="cat-portrait"></div>
            <div class="cat-overlay">
              <h2 class="cat-title" data-i18n="nav_portrait"></h2>
              <span class="cat-btn" data-i18n="cat_view"></span>
            </div>
          </a>

          <a href="/photos/events/" class="cat-card" aria-label="Events gallery">
            <div class="cat-img" id="cat-events"></div>
            <div class="cat-overlay">
              <h2 class="cat-title" data-i18n="nav_events"></h2>
              <span class="cat-btn" data-i18n="cat_view"></span>
            </div>
          </a>

          <a href="/photos/products/" class="cat-card" aria-label="Products gallery">
            <div class="cat-img" id="cat-products"></div>
            <div class="cat-overlay">
              <h2 class="cat-title" data-i18n="nav_products"></h2>
              <span class="cat-btn" data-i18n="cat_view"></span>
            </div>
          </a>

        </div>
      </div>
    </section>

    <section id="contact" aria-labelledby="contact-heading">
      <div class="container container--narrow">
        <header class="section-header">
          <h2 id="contact-heading" data-i18n="contact_title"></h2>
          <p data-i18n="contact_subtitle"></p>
        </header>
        <div class="contact-info">
          <div class="contact-item">
            <span class="contact-label" data-i18n="contact_email_label"></span>
            <a href="mailto:martintisophotographer@gmail.com">martintisophotographer@gmail.com</a>
          </div>
          <div class="contact-item">
            <span class="contact-label" data-i18n="contact_phone_label"></span>
            <a href="tel:+420776565300">+420 776 565 300</a>
          </div>
        </div>
      </div>
    </section>

    <footer id="site-footer">
      <div class="container footer-inner">
        <a href="/photos/" class="logo logo--footer" aria-label="Tiso Photo">Tiso<span>Photo</span></a>
        <nav class="social-links" aria-label="Social media">
          <a href="https://www.instagram.com/martintiso" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
            </svg>
          </a>
          <a href="https://www.facebook.com/martin.tiso" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
            </svg>
          </a>
          <a href="https://cz.linkedin.com/in/martintiso" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>
            </svg>
          </a>
        </nav>
        <p class="footer-copy" data-i18n="footer_copy"></p>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
